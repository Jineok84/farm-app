<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- 배경 -->
  <rect width="512" height="512" rx="80" fill="#0d1117"/>
  <!-- 초록 상단 바 -->
  <rect x="40" y="50" width="432" height="6" rx="3" fill="#4ade80" opacity="0.5"/>
  <!-- 스마트 -->
  <text x="256" y="200" font-family="Arial, sans-serif" font-size="100" font-weight="900" fill="#4ade80" text-anchor="middle" letter-spacing="-1">스마트</text>
  <!-- 구분선 -->
  <rect x="80" y="230" width="352" height="4" rx="2" fill="#58a6ff" opacity="0.4"/>
  <!-- 농약관리 -->
  <text x="256" y="340" font-family="Arial, sans-serif" font-size="100" font-weight="900" fill="#e6edf3" text-anchor="middle" letter-spacing="-1">농약관리</text>
  <!-- 하단 바 -->
  <rect x="40" y="420" width="432" height="6" rx="3" fill="#4ade80" opacity="0.5"/>
</svg>
