<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- 배경 -->
  <rect width="512" height="512" rx="100" fill="#0d1117"/>
  <!-- 상단 포인트 라인 -->
  <rect x="60" y="60" width="392" height="4" rx="2" fill="#58a6ff" opacity="0.3"/>
  <!-- 메인 텍스트: 스마트 -->
  <text x="256" y="210" font-family="Arial, sans-serif" font-size="88" font-weight="900" fill="#4ade80" text-anchor="middle" letter-spacing="-2">스마트</text>
  <!-- 서브 텍스트: 농약관리 -->
  <text x="256" y="310" font-family="Arial, sans-serif" font-size="88" font-weight="900" fill="#e6edf3" text-anchor="middle" letter-spacing="-2">농약관리</text>
  <!-- 하단 강조선 -->
  <rect x="100" y="355" width="312" height="5" rx="2.5" fill="#4ade80"/>
  <!-- 작은 서브타이틀 -->
  <text x="256" y="410" font-family="Arial, sans-serif" font-size="32" fill="#58a6ff" text-anchor="middle" letter-spacing="2">기작 로테이션</text>
  <!-- 하단 포인트 라인 -->
  <rect x="60" y="448" width="392" height="4" rx="2" fill="#58a6ff" opacity="0.3"/>
</svg>
