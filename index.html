<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="농약관리">
<title>농약 기작 관리</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #0d1117; color: #e6edf3; font-family: 'Noto Sans KR', sans-serif; max-width: 500px; margin: 0 auto; padding-bottom: 80px; }
input, button { font-family: inherit; }
.header { background: linear-gradient(135deg,#1a2332,#0d1117); border-bottom: 1px solid #21262d; padding: 16px; }
.header-sub { font-size: 10px; color: #58a6ff; letter-spacing: 3px; margin-bottom: 4px; }
.header-title { font-size: 20px; font-weight: 700; }
.header-desc { font-size: 11px; color: #8b949e; margin-top: 4px; }
.install-banner { background: linear-gradient(135deg,#1a3a1a,#0d2010); border: 1px solid #4ade80; border-radius: 10px; margin: 12px 16px; padding: 10px 14px; display: none; justify-content: space-between; align-items: center; }
.install-btn { background: #4ade80; color: #0d1117; border: none; border-radius: 8px; padding: 7px 14px; font-size: 13px; font-weight: 700; cursor: pointer; flex-shrink: 0; margin-left: 10px; }
.ios-guide { background: #1a2332; border: 1px solid #58a6ff; border-radius: 10px; margin: 0 16px 12px; padding: 12px 14px; display: none; }
.tabs { display: flex; background: #161b22; border-bottom: 1px solid #21262d; }
.tab { flex: 1; padding: 11px 0; background: transparent; color: #8b949e; border: none; border-bottom: 2px solid transparent; font-size: 13px; font-weight: 600; cursor: pointer; }
.tab.active { background: #21262d; color: #58a6ff; border-bottom: 2px solid #58a6ff; }
.page { display: none; padding: 14px; }
.page.active { display: block; }
.card { background: #161b22; border: 1px solid #21262d; border-radius: 12px; padding: 14px; margin-bottom: 12px; }
.label { font-size: 12px; color: #8b949e; font-weight: 600; margin-bottom: 6px; margin-top: 12px; }
.label:first-child { margin-top: 0; }
.crop-btns { display: flex; flex-wrap: wrap; gap: 6px; }
.crop-btn { padding: 5px 11px; border-radius: 20px; border: 1px solid #30363d; background: transparent; color: #8b949e; font-size: 13px; cursor: pointer; }
.crop-btn.active { border-color: #58a6ff; background: #1f3a5f; color: #58a6ff; }
input[type=text], input[type=date] { width: 100%; background: #0d1117; border: 1px solid #30363d; border-radius: 8px; padding: 10px 12px; color: #e6edf3; font-size: 14px; }
input:focus { outline: none; border-color: #58a6ff; }
.pos-rel { position: relative; }
.suggest-box { position: absolute; top: 100%; left: 0; right: 0; background: #1c2128; border: 1px solid #30363d; border-radius: 8px; z-index: 10; max-height: 300px; overflow-y: auto; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
.suggest-item { padding: 10px 12px; cursor: pointer; border-bottom: 1px solid #21262d; }
.suggest-item:active { background: #21262d; }
.suggest-name { font-size: 14px; font-weight: 600; }
.suggest-sub { font-size: 11px; color: #8b949e; margin-top: 2px; }
.suggest-code { font-size: 11px; color: #58a6ff; background: #1a2332; padding: 2px 7px; border-radius: 8px; float: right; margin-left: 6px; }
.fun-tag { font-size: 10px; color: #4ade80; background: #1a3a1a; padding: 1px 5px; border-radius: 4px; margin-right: 4px; }
.ins-tag { font-size: 10px; color: #f59e0b; background: #2a1f0a; padding: 1px 5px; border-radius: 4px; margin-right: 4px; }
.matched-box { background: #1a2332; border: 1px solid #21262d; border-radius: 8px; padding: 10px 12px; margin-top: 8px; display: flex; gap: 12px; flex-wrap: wrap; }
.tag { display: flex; flex-direction: column; gap: 2px; }
.tag-label { font-size: 10px; color: #8b949e; }
.tag-value { font-size: 12px; font-weight: 700; }
.btn-save { width: 100%; padding: 13px; background: linear-gradient(135deg,#1d4ed8,#2563eb); color: #fff; border: none; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 12px; }
.btn-save:disabled { background: #21262d; color: #6e7681; cursor: default; }
.warning { background: linear-gradient(135deg,#3d1a1a,#2d1010); border: 1px solid #f87171; border-radius: 10px; padding: 12px 14px; margin-bottom: 12px; display: flex; gap: 10px; }
.warning-title { color: #f87171; font-weight: 700; font-size: 14px; }
.warning-text { color: #fca5a5; font-size: 12px; margin-top: 2px; }
.record-card { background: #0d1117; border: 1px solid #21262d; border-radius: 8px; padding: 10px 12px; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.record-name { font-size: 14px; font-weight: 600; margin-bottom: 2px; }
.record-sub { font-size: 11px; color: #8b949e; }
.record-code { font-size: 11px; background: #1a2332; color: #58a6ff; padding: 2px 8px; border-radius: 10px; margin-bottom: 3px; }
.section-title { font-size: 13px; font-weight: 700; margin-bottom: 8px; padding: 6px 10px; border-radius: 8px; }
.empty { text-align: center; color: #8b949e; padding: 40px 0; font-size: 14px; }
.filter-btns { display: flex; gap: 6px; margin-bottom: 12px; }
.filter-btn { flex: 1; padding: 7px; border-radius: 8px; border: 1px solid #30363d; background: transparent; color: #8b949e; font-size: 12px; cursor: pointer; font-weight: 600; text-align: center; }
.filter-btn.active { border-color: #58a6ff; background: #1f3a5f; color: #58a6ff; }
.guide-box { background: #161b22; border: 1px solid #21262d; border-radius: 12px; padding: 14px; margin-top: 16px; }
.bar-row { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
.bar-label { width: 65px; font-size: 10px; color: #8b949e; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex-shrink: 0; }
.bar-bg { flex: 1; background: #21262d; border-radius: 4px; height: 13px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 4px; }
.rec-card { background: #0d1117; border-radius: 8px; padding: 10px 12px; margin-bottom: 5px; display: flex; justify-content: space-between; align-items: center; }

  <button class="install-btn" onclick="installApp()">설치</button>
</div>

<div id="iosGuide" class="ios-guide">

    3️⃣ <strong style="color:#e6edf3">"추가"</strong> 클릭
  </div>
  <button onclick="document.getElementById('iosGuide').style.display='none'" style="margin-top:10px;background:none;border:1px solid #30363d;color:#8b949e;padding:5px 12px;border-radius:6px;font-size:12px;cursor:pointer">닫기</button>
</div>

<div class="tabs">
  <button class="tab active" onclick="showTab('record')">📝 기록</button>
  <button class="tab" onclick="showTab('history')">📋 이력</button>
  <button class="tab" onclick="showTab('recommend')">💡 추천</button>
</div>

<div id="tab-record" class="page active">
  <div id="warningBox" style="display:none" class="warning">
    <div style="font-size:20px">⚠️</div>
    <div>
      <div class="warning-title" id="warningTitle"></div>
      <div class="warning-text" id="warningText"></div>
      <div class="warning-text" id="warningText2"></div>
    </div>
  </div>
  <div class="card">
    <div class="label">🌾 작물</div>
    <div class="crop-btns" id="cropBtns"></div>
    <div class="label">📅 날짜</div>
    <input type="date" id="dateInput">
    <div class="label">💊 농약 입력 <span style="font-size:10px;color:#4ade80;font-weight:400">(상표명 입력하면 자동 검색)</span></div>
    <div class="pos-rel">
      <input type="text" id="nameInput" placeholder="예: 캡틴, 오티바, 코니도..." oninput="handleNameInput(this.value)" autocomplete="off">
      <div class="suggest-box" id="suggestBox" style="display:none"></div>
    </div>
    <div id="matchedBox" class="matched-box" style="display:none"></div>
    <div class="label">🎯 방제 대상</div>
    <input type="text" id="targetInput" placeholder="예: 흰가루병, 총채벌레">
    <button class="btn-save" id="saveBtn" onclick="saveRecord()" disabled>✅ 기록 저장</button>
  </div>
  <div id="recentRecords"></div>
</div>

<div id="tab-history" class="page">
  <input type="text" id="searchInput" placeholder="상표명, 기작코드 검색" oninput="renderHistory()" style="margin-bottom:12px">
  <div id="historyContent"></div>
</div>

<div id="tab-recommend" class="page">
  <div style="background:#161b22;border:1px solid #21262d;border-radius:10px;padding:10px 14px;margin-bottom:12px;font-size:12px;color:#8b949e">

  <div class="filter-btns">
    <button class="filter-btn active" onclick="setRecFilter('all')">전체</button>
    <button class="filter-btn" onclick="setRecFilter('fun')">🍄 살균제</button>
    <button class="filter-btn" onclick="setRecFilter('ins')">🐛 살충제</button>
    <button class="filter-btn" onclick="setRecFilter('new')">🆕 신약</button>
  </div>
  <div id="recommendContent"></div>
</div>

  {name:"시스텐",code:"사1",ingr:"Myclobutanil",type:"살균",targets:["흰가루병"],date:"1987-04-15"},

  {name:"데스플러스",code:"3a",ingr:"Deltamethrin",type:"살충",targets:["목화진딧물"],date:"1981-03-02"}
];

const CODE_GROUPS = {
  "다3":"QoI계(스트로빌루린)","다2":"SDHI계","사1":"DMI계(트리아졸)",
  "나6":"메트라페논계","아5":"CAA계","다4":"아미설브롬계",
  "나5":"플루오피콜라이드계","바9":"옥사티아피프롤린계","마2":"페닐피롤계",
  "4a":"네오니코티노이드계","3a":"피레스로이드계","1b":"유기인계","1a":"카바메이트계",
  "6":"아버멕틴계","28":"다이아미드계","23":"테트론산계",
  "21a":"METI계","5":"스피노신계","29":"플로니카미드계",
  "9b":"피리플루퀴나존계","9d":"아피도피로펜계","30":"플룩사메타마이드계",
  "13":"클로르페나피르계","16":"뷰프로페진계","33":"아시노나피르계",
  "25a":"시에노피라펜계","10b":"에톡사졸계","34":"플로메토퀸계","22a":"옥사디아진계"
};

function getGroup(code) {
  if (!code || code === "미상") return "미분류";
  for (const [key, val] of Object.entries(CODE_GROUPS)) {
    if (code === key || code.startsWith(key+"+") || code.endsWith("+"+key) || code.includes("+"+key+"+")) return val;
  }
  return code;
}

const CROPS = ["참외","포도","고추","사과","복숭아","감","대추","자두"];
let records = JSON.parse(localStorage.getItem("farm_records")||"[]");
let selectedCrop = "참외";
let matchedItem = null;
let recFilter = "all";
let deferredPrompt = null;

window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault(); deferredPrompt = e;
  document.getElementById("installBanner").style.display = "flex";
});

function installApp() {
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  if (isIOS) {
    document.getElementById("iosGuide").style.display = "block";
    document.getElementById("installBanner").style.display = "none";
  } else if (deferredPrompt) {
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(() => { deferredPrompt = null; document.getElementById("installBanner").style.display = "none"; });
  }
}

window.onload = function() {
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  if (isIOS && !window.navigator.standalone) document.getElementById("installBanner").style.display = "flex";
  document.getElementById("dateInput").value = new Date().toISOString().slice(0,10);
  renderCropBtns();
  renderRecent();
  renderRecommend();
};

function renderCropBtns() {
  document.getElementById("cropBtns").innerHTML = CROPS.map(c =>
    `<button class="crop-btn ${c===selectedCrop?"active":""}" onclick="selectCrop('${c}')">${c}</button>`
  ).join("");
}
function selectCrop(c) { selectedCrop=c; renderCropBtns(); checkWarning(); renderRecent(); }

function showTab(tab) {
  document.querySelectorAll(".tab").forEach((t,i) => t.classList.toggle("active",["record","history","recommend"][i]===tab));
  document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
  document.getElementById("tab-"+tab).classList.add("active");
  if (tab==="history") renderHistory();
  if (tab==="recommend") renderRecommend();
}

function handleNameInput(val) {
  document.getElementById("saveBtn").disabled = !val.trim();
  hideWarning();

  if (!val || val.length < 1) {
    document.getElementById("suggestBox").style.display = "none";
    document.getElementById("matchedBox").style.display = "none";
    matchedItem = null;
    return;
  }

  // DB에서 자동 매칭
  const exact = PESTICIDE_DB.find(p => p.name === val.trim());
  if (exact) {
    matchedItem = exact;
    showMatched(exact);
    document.getElementById("suggestBox").style.display = "none";
    checkWarning();
    return;
  }

  // 자동완성 목록
  const hits = PESTICIDE_DB.filter(p => p.name.includes(val) || val.includes(p.name)).slice(0,10);
  const box = document.getElementById("suggestBox");
  if (!hits.length) { box.style.display="none"; return; }

  box._hits = hits;
  box.innerHTML = hits.map((p,i) => {
    const isFresh = p.date >= "2024-01-01";
    const isNew = p.date >= "2022-01-01";
    const typeTag = p.type==="살균"
      ? `<span class="fun-tag">살균</span>`
      : `<span class="ins-tag">살충</span>`;
    return `<div class="suggest-item" onclick="selectSuggest(${i})">
      <span class="suggest-code">${p.code}</span>
      <div class="suggest-name">${typeTag}${p.name}${isFresh?" 🆕":isNew?" ✨":""}</div>
      <div class="suggest-sub">${p.ingr}</div>
      <div class="suggest-sub">${p.targets.join(" · ")} · 등록 ${p.date}</div>
    </div>`;
  }).join("");
  box.style.display = "block";
}

function selectSuggest(i) {
  const p = document.getElementById("suggestBox")._hits[i];
  matchedItem = p;
  document.getElementById("nameInput").value = p.name;
  document.getElementById("suggestBox").style.display = "none";
  document.getElementById("saveBtn").disabled = false;
  showMatched(p);
  checkWarning();
}

function showMatched(p) {
  const isFresh = p.date >= "2024-01-01";
  const isNew = p.date >= "2022-01-01";
  const typeColor = p.type==="살균" ? "#4ade80" : "#f59e0b";
  const typeBg = p.type==="살균" ? "#1a3a1a" : "#2a1f0a";
  document.getElementById("matchedBox").innerHTML = `
    <div class="tag">
      <div class="tag-label">구분</div>
      <div class="tag-value" style="color:${typeColor};background:${typeBg};padding:2px 6px;border-radius:4px">${p.type==="살균"?"🍄 살균제":"🐛 살충제"}</div>
    </div>
    <div class="tag">
      <div class="tag-label">기작코드</div>
      <div class="tag-value" style="color:#58a6ff">${p.code}</div>
    </div>
    <div class="tag">
      <div class="tag-label">계통</div>
      <div class="tag-value" style="color:#a78bfa;font-size:11px">${getGroup(p.code)}</div>
    </div>
    <div class="tag">
      <div class="tag-label">등록일</div>
      <div class="tag-value" style="color:${isFresh?"#4ade80":isNew?"#f59e0b":"#8b949e"}">${p.date}${isFresh?" 🆕":""}</div>
    </div>
    <div class="tag">
      <div class="tag-label">방제대상</div>
      <div class="tag-value" style="color:#e6edf3;font-size:11px">${p.targets.join(", ")}</div>
    </div>
  `;
  document.getElementById("matchedBox").style.display = "flex";
}

function checkWarning() {
  if (!matchedItem) { hideWarning(); return; }
  const myGroup = getGroup(matchedItem.code);
  const prev = records.filter(r => r.crop === selectedCrop && getGroup(r.code) === myGroup);
  if (prev.length >= 1) {
    const prevNames = [...new Set(prev.map(r=>r.name))].slice(0,3).join(", ");
    showWarning(
      `⚠️ 교차저항 위험! (${prev.length+1}회 연속)`,
      `${myGroup} 계통 — 이전 사용: ${prevNames}`,
      "같은 계통 약제는 교차저항 발생! 다른 기작으로 교체하세요."
    );
  } else hideWarning();
}

function showWarning(t,t2,t3) {
  document.getElementById("warningBox").style.display="flex";
  document.getElementById("warningTitle").textContent=t;
  document.getElementById("warningText").textContent=t2;
  document.getElementById("warningText2").textContent=t3;
}
function hideWarning() { document.getElementById("warningBox").style.display="none"; }

function saveRecord() {
  const name = document.getElementById("nameInput").value.trim();
  if (!name) return;

  // DB에서 자동 매칭 (직접 입력해도 저장 가능)
  const p = matchedItem || PESTICIDE_DB.find(x => x.name === name) || {
    name, code:"미상", ingr:"", type:"", date:"", targets:[]
  };

  const rec = {
    id: Date.now(),
    name: p.name,
    crop: selectedCrop,
    date: document.getElementById("dateInput").value,
    target: document.getElementById("targetInput").value,
    code: p.code,
    ingr: p.ingr,
    type: p.type,
    regDate: p.date,
    targets: p.targets || []
  };

  records.unshift(rec);
  localStorage.setItem("farm_records", JSON.stringify(records));

  // 초기화
  document.getElementById("nameInput").value = "";
  document.getElementById("targetInput").value = "";
  document.getElementById("matchedBox").style.display = "none";
  document.getElementById("saveBtn").disabled = true;
  matchedItem = null;
  hideWarning();
  renderRecent();
  renderRecommend();
  alert("✅ 저장되었습니다!");
}

function recordHtml(r, compact=false) {
  const isFresh = r.regDate >= "2024-01-01";
  const isNew = r.regDate >= "2022-01-01";
  const typeLabel = r.type==="살균" ? `<span style="font-size:10px;color:#4ade80;background:#1a3a1a;padding:1px 5px;border-radius:4px;margin-left:3px">살균</span>`
    : r.type==="살충" ? `<span style="font-size:10px;color:#f59e0b;background:#2a1f0a;padding:1px 5px;border-radius:4px;margin-left:3px">살충</span>` : "";
  return `<div class="record-card">
    <div style="flex:1;min-width:0">
      <div class="record-name">${r.name}${typeLabel}${isFresh?`<span style="font-size:10px;color:#58a6ff;background:#1a2332;padding:1px 5px;border-radius:4px;margin-left:3px">2024+</span>`:""}</div>
      ${!compact?`<div class="record-sub">${r.crop} · ${r.target||"방제대상 미입력"}</div>`:""}
      ${r.ingr?`<div class="record-sub">${r.ingr}</div>`:""}
      <div class="record-sub">${r.date}</div>
    </div>
    <div style="text-align:right;flex-shrink:0">
      <div class="record-code">${r.code}</div>
      <div style="font-size:10px;color:#8b949e">${getGroup(r.code)}</div>
    </div>
  </div>`;
}

function renderRecent() {
  const el = document.getElementById("recentRecords");
  const cropRecs = records.filter(r => r.crop === selectedCrop);
  if (!cropRecs.length) { el.innerHTML=`<div style="text-align:center;color:#8b949e;padding:20px;font-size:13px">${selectedCrop} 기록이 없습니다</div>`; return; }
  el.innerHTML = `<div class="label" style="margin-bottom:8px">${selectedCrop} 최근 기록</div>` +
    cropRecs.slice(0,3).map(r => recordHtml(r)).join("");
}

function renderHistory() {
  const search = document.getElementById("searchInput")?.value||"";
  const el = document.getElementById("historyContent");
  if (!records.length) { el.innerHTML=`<div class="empty">아직 기록이 없습니다.</div>`; return; }

  const cr = records.filter(r => !search || r.name.includes(search) || r.code.includes(search));
  if (!cr.length) { el.innerHTML=`<div class="empty">검색 결과 없음</div>`; return; }

  const funRecs = cr.filter(r => r.type==="살균");
  const insRecs = cr.filter(r => r.type==="살충");
  const cgcFun={}, cgcIns={};
  funRecs.forEach(r => { const g=getGroup(r.code); cgcFun[g]=(cgcFun[g]||0)+1; });
  insRecs.forEach(r => { const g=getGroup(r.code); cgcIns[g]=(cgcIns[g]||0)+1; });

  let html = "";
  const allDangers = [...Object.entries(cgcFun),...Object.entries(cgcIns)].filter(([,v])=>v>=2);
  if (allDangers.length) {
    html += `<div style="background:#2d1010;border:1px solid #f87171;border-radius:10px;padding:10px 14px;margin-bottom:12px">
      <div style="color:#f87171;font-weight:700;font-size:13px;margin-bottom:6px">⚠️ 교차저항 위험 계통</div>
      ${allDangers.map(([g,cnt])=>`<div style="font-size:12px;color:#fca5a5;margin-bottom:3px">• ${g} — ${cnt}회</div>`).join("")}
    </div>`;
  }

  if (funRecs.length) {
    html += `<div class="section-title" style="color:#4ade80;background:#1a3a1a">🍄 살균제 이력</div>`;
    Object.entries(cgcFun).sort((a,b)=>b[1]-a[1]).forEach(([g,cnt]) => {
      const color = cnt>=2?"#f87171":"#4ade80";
      html += `<div class="bar-row"><div class="bar-label">${g.split("(")[0]}</div><div class="bar-bg"><div class="bar-fill" style="width:${Math.min(cnt*20,100)}%;background:${color}"></div></div><div style="font-size:12px;color:${color};width:24px">${cnt}회</div></div>`;
    });
    funRecs.slice(0,5).forEach(r => { html += recordHtml(r,true); });
    if(funRecs.length>5) html += `<div style="text-align:center;color:#8b949e;font-size:12px;margin-top:4px">+${funRecs.length-5}건 더</div>`;
  }

  if (insRecs.length) {
    html += `<div class="section-title" style="color:#f59e0b;background:#2a1f0a;margin-top:12px">🐛 살충제 이력</div>`;
    Object.entries(cgcIns).sort((a,b)=>b[1]-a[1]).forEach(([g,cnt]) => {
      const color = cnt>=2?"#f87171":"#f59e0b";
      html += `<div class="bar-row"><div class="bar-label">${g.split("(")[0]}</div><div class="bar-bg"><div class="bar-fill" style="width:${Math.min(cnt*20,100)}%;background:${color}"></div></div><div style="font-size:12px;color:${color};width:24px">${cnt}회</div></div>`;
    });
    insRecs.slice(0,5).forEach(r => { html += recordHtml(r,true); });
    if(insRecs.length>5) html += `<div style="text-align:center;color:#8b949e;font-size:12px;margin-top:4px">+${insRecs.length-5}건 더</div>`;
  }

  el.innerHTML = html;
}

function setRecFilter(f) {
  recFilter = f;
  document.querySelectorAll(".filter-btn").forEach((b,i) => b.classList.toggle("active",["all","fun","ins","new"][i]===f));
  renderRecommend();
}

function renderRecommend() {
  const el = document.getElementById("recommendContent");
  const usedGroups = {};
  records.filter(r=>r.crop===selectedCrop).forEach(r => { const g=getGroup(r.code); usedGroups[g]=(usedGroups[g]||0)+1; });

  let filtered = [...PESTICIDE_DB];
  if (recFilter==="fun") filtered = filtered.filter(p=>p.type==="살균");
  else if (recFilter==="ins") filtered = filtered.filter(p=>p.type==="살충");
  else if (recFilter==="new") filtered = filtered.filter(p=>p.date>="2022-01-01");

  const scored = filtered.map(p => {
    const g = getGroup(p.code);
    const used = usedGroups[g] || 0;
    const score = (used===0?100:used===1?50:10) + (p.date>="2024-01-01"?20:p.date>="2022-01-01"?10:0);
    return {...p, score, used, group:g};
  }).sort((a,b) => b.score-a.score || b.date.localeCompare(a.date));

  // 기작 그룹별 대표 1개씩만
  const seen = new Set();
  const top = scored.filter(p => {
    const key = p.type+"_"+p.group;
    if (seen.has(key)) return false;
    seen.add(key); return true;
  });

  const funList = top.filter(p=>p.type==="살균");
  const insList = top.filter(p=>p.type==="살충");

  let html = "";

  if (funList.length && recFilter !== "ins") {
    html += `<div class="section-title" style="color:#4ade80;background:#1a3a1a">🍄 살균제 추천 (기작 중복 없이)</div>`;
    funList.slice(0,10).forEach(p => { html += recCardHtml(p); });
  }

  if (insList.length && recFilter !== "fun") {
    html += `<div class="section-title" style="color:#f59e0b;background:#2a1f0a;margin-top:12px">🐛 살충제 추천 (기작 중복 없이)</div>`;
    insList.slice(0,10).forEach(p => { html += recCardHtml(p); });
  }

  html += `<div class="guide-box">
    <div style="font-weight:700;margin-bottom:8px">📌 로테이션 원칙</div>
    ${["같은 계통은 상표명 달라도 교차저항 발생","동일 계통 연속 2회 이상 사용 금지","신약(2022↑) 활용으로 저항성 관리","M계(무기황·동제) 혼용으로 저항성 억제"].map((t,i)=>
      `<div style="display:flex;gap:8px;margin-bottom:5px;font-size:12px;color:#8b949e"><span style="color:#58a6ff">${i+1}.</span><span>${t}</span></div>`
    ).join("")}
  </div>`;

  el.innerHTML = html;
}

function recCardHtml(p) {
  const bc = p.used===0?"#1f3a5f":p.used>=2?"#3d1a1a":"#21262d";
  const tc = p.used===0?"#58a6ff":p.used>=2?"#f87171":"#fbbf24";
  const badge = p.used===0?"✅ 미사용":p.used>=2?"⚠️ 교체필요":"사용중";
  const isFresh = p.date >= "2024-01-01";
  const isNew = p.date >= "2022-01-01";
  return `<div class="rec-card" style="border:1px solid ${bc}">
    <div style="flex:1;min-width:0">
      <div style="font-size:14px;font-weight:700;margin-bottom:3px">
        ${p.name}
        ${isFresh?`<span style="font-size:10px;color:#4ade80;background:#1a3a1a;padding:1px 5px;border-radius:4px;margin-left:3px">2024+</span>`:
          isNew?`<span style="font-size:10px;color:#f59e0b;background:#2a1f0a;padding:1px 5px;border-radius:4px;margin-left:3px">NEW</span>`:""}
      </div>
      <div style="font-size:11px;color:#8b949e">${p.ingr}</div>
      <div style="font-size:11px;color:#6e7681;margin-top:2px">${p.targets.join(" · ")}</div>
    </div>
    <div style="text-align:right;flex-shrink:0;margin-left:8px">
      <div style="font-size:11px;background:#1a2332;color:#58a6ff;padding:2px 7px;border-radius:8px;margin-bottom:3px">${p.code}</div>
      <div style="font-size:10px;color:${tc}">${badge}</div>
      <div style="font-size:10px;color:#6e7681">${p.used}회 사용</div>
    </div>
  </div>`;
}

document.addEventListener("click", function(e) {
  if (!e.target.closest(".pos-rel")) document.getElementById("suggestBox").style.display="none";
});
</script>
