<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0d1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="농약관리">
<title>농약 기작 관리</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0d1117; color: #e6edf3; font-family: 'Noto Sans KR', sans-serif; max-width: 500px; margin: 0 auto; padding-bottom: 80px; }
  input, button, select { font-family: inherit; }
  .header { background: linear-gradient(135deg,#1a2332,#0d1117); border-bottom: 1px solid #21262d; padding: 20px 16px 14px; }
  .header-sub { font-size: 10px; color: #58a6ff; letter-spacing: 3px; margin-bottom: 4px; }
  .header-title { font-size: 21px; font-weight: 700; }
  .tabs { display: flex; background: #161b22; border-bottom: 1px solid #21262d; }
  .tab { flex: 1; padding: 12px 0; background: transparent; color: #8b949e; border: none; border-bottom: 2px solid transparent; font-size: 13px; font-weight: 600; cursor: pointer; }
  .tab.active { background: #21262d; color: #58a6ff; border-bottom: 2px solid #58a6ff; }
  .page { display: none; padding: 16px; }
  .page.active { display: block; }
  .card { background: #161b22; border: 1px solid #21262d; border-radius: 12px; padding: 16px; margin-bottom: 14px; }
  .label { font-size: 12px; color: #8b949e; font-weight: 600; margin-bottom: 6px; }
  .crop-btns { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 14px; }
  .crop-btn { padding: 6px 12px; border-radius: 20px; border: 1px solid #30363d; background: transparent; color: #8b949e; font-size: 13px; cursor: pointer; }
  .crop-btn.active { border-color: #58a6ff; background: #1f3a5f; color: #58a6ff; }
  input[type=text], input[type=date], input[type=password] { width: 100%; background: #0d1117; border: 1px solid #30363d; border-radius: 8px; padding: 10px 12px; color: #e6edf3; font-size: 14px; margin-bottom: 14px; }
  input:focus { outline: none; border-color: #58a6ff; }
  .suggest-box { position: absolute; top: 100%; left: 0; right: 0; background: #1c2128; border: 1px solid #30363d; border-radius: 8px; z-index: 10; max-height: 260px; overflow-y: auto; }
  .suggest-item { padding: 10px 12px; cursor: pointer; border-bottom: 1px solid #21262d; }
  .suggest-item:hover { background: #21262d; }
  .suggest-name { font-size: 14px; font-weight: 600; }
  .suggest-sub { font-size: 11px; color: #8b949e; margin-top: 2px; }
  .suggest-code { font-size: 11px; color: #58a6ff; background: #1a2332; padding: 2px 7px; border-radius: 8px; float: right; }
  .matched-box { background: #1a2332; border: 1px solid #21262d; border-radius: 8px; padding: 10px 12px; margin-bottom: 14px; display: flex; gap: 16px; flex-wrap: wrap; }
  .tag { display: flex; flex-direction: column; gap: 2px; }
  .tag-label { font-size: 10px; color: #8b949e; }
  .tag-value { font-size: 12px; font-weight: 700; }
  .btn-save { width: 100%; padding: 13px; background: linear-gradient(135deg,#1d4ed8,#2563eb); color: #fff; border: none; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 6px; }
  .btn-save:disabled { background: #21262d; color: #6e7681; cursor: default; }
  .warning { background: linear-gradient(135deg,#3d1a1a,#2d1010); border: 1px solid #f87171; border-radius: 10px; padding: 12px 14px; margin-bottom: 14px; display: flex; gap: 10px; }
  .warning-icon { font-size: 22px; }
  .warning-title { color: #f87171; font-weight: 700; font-size: 14px; }
  .warning-text { color: #fca5a5; font-size: 12px; margin-top: 2px; }
  .api-box { margin: 8px 16px; background: #0f2a1a; border: 1px solid #4ade80; border-radius: 8px; padding: 8px 12px; display: flex; justify-content: space-between; align-items: center; }
  .api-setup { margin: 16px; background: #161b22; border: 1px solid #f59e0b; border-radius: 12px; padding: 14px; }
  .btn-api { width: 100%; padding: 10px; background: linear-gradient(135deg,#b45309,#d97706); color: #fff; border: none; border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer; }
  .btn-change { font-size: 11px; color: #8b949e; background: none; border: none; cursor: pointer; }
  .record-card { background: #0d1117; border: 1px solid #21262d; border-radius: 8px; padding: 10px 12px; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .record-name { font-size: 14px; font-weight: 600; margin-bottom: 2px; }
  .record-sub { font-size: 11px; color: #8b949e; }
  .record-code { font-size: 11px; background: #1a2332; color: #58a6ff; padding: 2px 8px; border-radius: 10px; margin-bottom: 3px; text-align: right; }
  .bar-row { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
  .bar-label { width: 65px; font-size: 10px; color: #8b949e; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex-shrink: 0; }
  .bar-bg { flex: 1; background: #21262d; border-radius: 4px; height: 14px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 4px; }
  .bar-count { font-size: 12px; width: 24px; }
  .rec-card { background: #0d1117; border-radius: 8px; padding: 10px 12px; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; }
  .section-title { font-size: 13px; font-weight: 700; color: #58a6ff; margin-bottom: 10px; }
  .section-title2 { font-size: 13px; font-weight: 700; color: #58a6ff; margin-bottom: 10px; margin-top: 16px; }
  .empty { text-align: center; color: #8b949e; padding: 40px 0; font-size: 14px; }
  .danger-badge { background: #3d1a1a; color: #f87171; font-size: 11px; padding: 2px 8px; border-radius: 10px; font-weight: 600; }
  .pos-rel { position: relative; }
  .searching { position: absolute; right: 12px; top: 12px; font-size: 12px; color: #8b949e; }
  .guide-box { background: #161b22; border: 1px solid #21262d; border-radius: 12px; padding: 14px; margin-top: 20px; }
  .guide-item { display: flex; gap: 8px; margin-bottom: 6px; font-size: 13px; color: #8b949e; }
  .guide-num { color: #58a6ff; }
</style>
</head>
<body>

<div class="header">
  <div class="header-sub">PESTICIDE ROTATION MANAGER</div>
  <div class="header-title">🌿 농약 기작 관리</div>
</div>

<div id="apiSetup" class="api-setup">
  <div style="font-size:13px;font-weight:700;color:#f59e0b;margin-bottom:8px">🔑 공공데이터 API 키 입력</div>
  <div style="font-size:12px;color:#8b949e;margin-bottom:10px">data.go.kr에서 발급받은 키를 입력하세요. 이 기기에만 저장됩니다.</div>
  <input type="password" id="apiKeyInput" placeholder="API 키 입력" style="margin-bottom:10px">
  <button class="btn-api" onclick="saveApiKey()">저장</button>
</div>
<div id="apiConnected" class="api-box" style="display:none">
  <span style="font-size:12px;color:#4ade80">✅ API 키 연결됨 — 상표명 실시간 검색 가능</span>
  <button class="btn-change" onclick="changeApiKey()">변경</button>
</div>

<div class="tabs">
  <button class="tab active" onclick="showTab('record')">📝 기록</button>
  <button class="tab" onclick="showTab('history')">📋 이력</button>
  <button class="tab" onclick="showTab('recommend')">💡 추천</button>
</div>

<!-- 기록 탭 -->
<div id="tab-record" class="page active">
  <div id="warningBox" style="display:none" class="warning">
    <div class="warning-icon">⚠️</div>
    <div>
      <div class="warning-title" id="warningTitle"></div>
      <div class="warning-text" id="warningText"></div>
      <div class="warning-text" id="warningText2"></div>
    </div>
  </div>
  <div class="card">
    <div class="label">🌾 작물</div>
    <div class="crop-btns" id="cropBtns"></div>
    <div class="label">📅 날짜</div>
    <input type="date" id="dateInput">
    <div class="label">💊 상표명 검색</div>
    <div class="pos-rel">
      <input type="text" id="nameInput" placeholder="상표명 입력 (예: 델란, 오티바)" oninput="handleNameInput(this.value)" autocomplete="off">
      <span class="searching" id="searchingText" style="display:none">검색중...</span>
      <div class="suggest-box" id="suggestBox" style="display:none"></div>
    </div>
    <div id="matchedBox" class="matched-box" style="display:none"></div>
    <div class="label">🎯 방제 대상</div>
    <input type="text" id="targetInput" placeholder="예: 흰가루병, 진딧물">
    <button class="btn-save" id="saveBtn" onclick="saveRecord()" disabled>✅ 기록 저장</button>
  </div>
  <div id="recentRecords"></div>
</div>

<!-- 이력 탭 -->
<div id="tab-history" class="page">
  <input type="text" id="searchInput" placeholder="상표명, 작물, 기작코드 검색" oninput="renderHistory()" style="margin-bottom:14px">
  <div id="historyContent"></div>
</div>

<!-- 추천 탭 -->
<div id="tab-recommend" class="page">
  <div style="background:#161b22;border:1px solid #21262d;border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:12px;color:#8b949e">
    💡 기록된 이력을 바탕으로 <span style="color:#58a6ff;font-weight:600">미사용 기작 계통</span>을 우선 추천합니다.
  </div>
  <div class="crop-btns" id="recCropBtns"></div>
  <div id="recommendContent"></div>
</div>

<script>
// ============================================================
// 데이터
// ============================================================
const CROSS_RESISTANCE = {
  "FRAC-11(QoI)": ["아족시스트로빈","크레속심메틸","트리플록시스트로빈","피라클로스트로빈","디목시스트로빈","오리사스트로빈"],
  "FRAC-3(DMI)":  ["테부코나졸","디페노코나졸","프로피코나졸","헥사코나졸","마이클로부타닐","페나리몰","사이프로코나졸","펜부코나졸"],
  "FRAC-7(SDHI)": ["보스칼리드","플루오피람","펜플루펜","이소피라잠","플룩사피록사드","벤조빈디플루피르"],
  "FRAC-1(MBC)":  ["카벤다짐","티오파네이트메틸","베노밀","티아벤다졸"],
  "FRAC-4":       ["메탈락실","메탈락실-M","옥사딕실"],
  "FRAC-2(DCI)":  ["이프로디온","빈클로졸린","프로시미돈"],
  "FRAC-9(AP)":   ["시프로디닐","피리메타닐","메파니피림"],
  "FRAC-40(CAA)": ["디메토모르프","만디프로파미드","이프로발리카브"],
  "IRAC-4A(Neon)":["이미다클로프리드","티아메톡삼","아세타미프리드","클로티아니딘","디노테푸란","니텐피람","플로니카미드"],
  "IRAC-3A(Pyr)": ["사이퍼메트린","람다사이할로트린","비펜트린","델타메트린","에토펜프록스","퍼메트린","펜발러레이트"],
  "IRAC-1B(OP)":  ["클로르피리포스","다이아지논","말라티온","펜토에이트","EPN","파라티온"],
  "IRAC-28(Dia)": ["클로란트라닐리프롤","플루벤다이아미드","사이안트라닐리프롤","테트라닐리프롤"],
  "IRAC-6(Aver)": ["아버멕틴","밀베멕틴","에마멕틴벤조에이트"],
  "IRAC-21A(METI)":["펜피록시메이트","피리다벤","테부펜피라드","펜아자퀸"],
  "IRAC-5(Spin)": ["스피노사드","스피네토람"],
};

const NAME_TO_GROUP = {};
Object.entries(CROSS_RESISTANCE).forEach(([g,names]) => names.forEach(n => NAME_TO_GROUP[n]=g));

const CROPS = ["참외","포도","고추","사과","복숭아","감","대추","자두"];

let records = JSON.parse(localStorage.getItem('farm_records')||'[]');
let apiKey = localStorage.getItem('farm_apikey')||'';
let selectedCrop = '참외';
let recCrop = '참외';
let matchedItem = null;
let debounceTimer = null;

// ============================================================
// 초기화
// ============================================================
window.onload = function() {
  const today = new Date().toISOString().slice(0,10);
  document.getElementById('dateInput').value = today;
  renderCropBtns();
  renderRecCropBtns();
  if (apiKey) showApiConnected();
  else showApiSetup();
  renderRecent();
  renderHistory();
  renderRecommend();
};

function saveToStorage() {
  localStorage.setItem('farm_records', JSON.stringify(records));
}

// ============================================================
// API 키
// ============================================================
function saveApiKey() {
  const k = document.getElementById('apiKeyInput').value.trim();
  if (!k) return;
  apiKey = k;
  localStorage.setItem('farm_apikey', k);
  showApiConnected();
}
function showApiConnected() {
  document.getElementById('apiSetup').style.display = 'none';
  document.getElementById('apiConnected').style.display = 'flex';
  document.getElementById('nameInput').placeholder = '상표명 입력 (예: 델란, 오티바, 코니도)';
}
function showApiSetup() {
  document.getElementById('apiSetup').style.display = 'block';
  document.getElementById('apiConnected').style.display = 'none';
  document.getElementById('nameInput').placeholder = 'API 키를 먼저 입력해주세요';
}
function changeApiKey() {
  apiKey = '';
  localStorage.removeItem('farm_apikey');
  showApiSetup();
}

// ============================================================
// 탭
// ============================================================
function showTab(tab) {
  document.querySelectorAll('.tab').forEach((t,i) => {
    const ids = ['record','history','recommend'];
    t.classList.toggle('active', ids[i]===tab);
  });
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('tab-'+tab).classList.add('active');
  if (tab==='history') renderHistory();
  if (tab==='recommend') renderRecommend();
}

// ============================================================
// 작물 버튼
// ============================================================
function renderCropBtns() {
  const el = document.getElementById('cropBtns');
  el.innerHTML = CROPS.map(c =>
    `<button class="crop-btn ${c===selectedCrop?'active':''}" onclick="selectCrop('${c}')">${c}</button>`
  ).join('');
}
function selectCrop(c) { selectedCrop=c; renderCropBtns(); checkWarning(); }

function renderRecCropBtns() {
  const el = document.getElementById('recCropBtns');
  el.innerHTML = CROPS.map(c =>
    `<button class="crop-btn ${c===recCrop?'active':''}" onclick="selectRecCrop('${c}')">${c}</button>`
  ).join('');
}
function selectRecCrop(c) { recCrop=c; renderRecCropBtns(); renderRecommend(); }

// ============================================================
// 농약 검색
// ============================================================
async function handleNameInput(val) {
  matchedItem = null;
  document.getElementById('matchedBox').style.display = 'none';
  document.getElementById('saveBtn').disabled = !val;
  hideWarning();

  if (!val || val.length < 2 || !apiKey) {
    document.getElementById('suggestBox').style.display = 'none';
    return;
  }
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(async () => {
    document.getElementById('searchingText').style.display = 'block';
    try {
      const url = `https://apis.data.go.kr/1390802/AgriChemService2/getApldcrRegistList2?serviceKey=${encodeURIComponent(apiKey)}&prduct_nm=${encodeURIComponent(val)}&numOfRows=20&pageNo=1&dataType=JSON`;
      const res = await fetch(url);
      const json = await res.json();
      let items = json?.body?.items || json?.response?.body?.items || [];
      if (!Array.isArray(items)) items = [items];
      renderSuggestions(items);
    } catch(e) {
      document.getElementById('suggestBox').innerHTML = '<div class="suggest-item" style="color:#f87171">API 오류. 키를 확인해주세요.</div>';
      document.getElementById('suggestBox').style.display = 'block';
    }
    document.getElementById('searchingText').style.display = 'none';
  }, 500);
}

function renderSuggestions(items) {
  const box = document.getElementById('suggestBox');
  if (!items.length) { box.style.display='none'; return; }
  const seen = new Set();
  const uniq = items.filter(i => {
    const nm = i.prduct_nm||'';
    if (!nm||seen.has(nm)) return false;
    seen.add(nm); return true;
  }).slice(0,8);
  box.innerHTML = uniq.map((item,i) => {
    const name = item.prduct_nm||'';
    const comp = item.ingr_nm||'';
    const code = item.actn_mchnsm_code||'';
    const crop = item.crop_nm||'';
    return `<div class="suggest-item" onclick="selectSuggestion(${i})">
      ${code?`<span class="suggest-code">${code}</span>`:''}
      <div class="suggest-name">${name}</div>
      ${comp?`<div class="suggest-sub">${comp}</div>`:''}
      ${crop?`<div class="suggest-sub">적용: ${crop}</div>`:''}
    </div>`;
  }).join('');
  box._items = uniq;
  box.style.display = 'block';
}

function selectSuggestion(i) {
  const box = document.getElementById('suggestBox');
  const item = box._items[i];
  matchedItem = {
    name: item.prduct_nm||'',
    mainComp: item.ingr_nm||'',
    code: item.actn_mchnsm_code||'',
    group: item.actn_mchnsm_nm||'',
  };
  document.getElementById('nameInput').value = matchedItem.name;
  box.style.display = 'none';
  document.getElementById('saveBtn').disabled = false;

  // 매칭 정보 표시
  const mb = document.getElementById('matchedBox');
  mb.innerHTML = `
    ${matchedItem.code?`<div class="tag"><div class="tag-label">기작코드</div><div class="tag-value" style="color:#58a6ff">${matchedItem.code}</div></div>`:''}
    ${matchedItem.group?`<div class="tag"><div class="tag-label">작용기작</div><div class="tag-value" style="color:#a78bfa">${matchedItem.group}</div></div>`:''}
    ${matchedItem.mainComp?`<div class="tag"><div class="tag-label">주성분</div><div class="tag-value" style="color:#8b949e">${matchedItem.mainComp}</div></div>`:''}
  `;
  mb.style.display = 'flex';
  checkWarning();
}

// ============================================================
// 교차저항 경고
// ============================================================
function checkWarning() {
  if (!matchedItem) { hideWarning(); return; }
  const name = matchedItem.name;
  const myGroup = NAME_TO_GROUP[name] || (matchedItem.code ? `CODE-${matchedItem.code}` : null);
  if (!myGroup) { hideWarning(); return; }

  const prev = records.filter(r => {
    if (r.crop !== selectedCrop) return false;
    const rg = NAME_TO_GROUP[r.name] || (r.code ? `CODE-${r.code}` : null);
    return rg === myGroup;
  });

  if (prev.length >= 1) {
    const prevNames = [...new Set(prev.map(r=>r.name))].slice(0,3).join(', ');
    showWarning(
      `교차저항 위험! (${prev.length+1}회 연속)`,
      `${myGroup} 계통 — 이전 사용: ${prevNames}`,
      '같은 계통 약제는 교차저항 발생! 다른 기작으로 교체하세요.'
    );
  } else hideWarning();
}

function showWarning(title, text, text2) {
  document.getElementById('warningBox').style.display = 'flex';
  document.getElementById('warningTitle').textContent = title;
  document.getElementById('warningText').textContent = text;
  document.getElementById('warningText2').textContent = text2;
}
function hideWarning() { document.getElementById('warningBox').style.display = 'none'; }

// ============================================================
// 기록 저장
// ============================================================
function saveRecord() {
  const name = document.getElementById('nameInput').value.trim();
  if (!name) return;
  const rec = {
    id: Date.now(),
    name,
    crop: selectedCrop,
    date: document.getElementById('dateInput').value,
    target: document.getElementById('targetInput').value,
    code: matchedItem?.code || '미상',
    group: matchedItem?.group || '미분류',
    mainComp: matchedItem?.mainComp || '',
    crossGroup: NAME_TO_GROUP[name] || '',
  };
  records.unshift(rec);
  saveToStorage();
  document.getElementById('nameInput').value = '';
  document.getElementById('targetInput').value = '';
  document.getElementById('matchedBox').style.display = 'none';
  document.getElementById('saveBtn').disabled = true;
  matchedItem = null;
  hideWarning();
  renderRecent();
  alert('✅ 저장되었습니다!');
}

// ============================================================
// 최근 기록
// ============================================================
function renderRecent() {
  const el = document.getElementById('recentRecords');
  const recent = records.slice(0,3);
  if (!recent.length) { el.innerHTML=''; return; }
  el.innerHTML = `<div class="label">최근 기록</div>` + recent.map(r => recordCardHtml(r)).join('');
}

function recordCardHtml(r, compact=false) {
  return `<div class="record-card">
    <div style="flex:1;min-width:0">
      <div class="record-name">${r.name}</div>
      ${!compact?`<div class="record-sub">${r.crop} · ${r.target||'방제대상 미입력'}</div>`:''}
      ${r.mainComp?`<div class="record-sub">${r.mainComp}</div>`:''}
      <div class="record-sub">${r.date}</div>
    </div>
    <div style="text-align:right;flex-shrink:0">
      ${r.code&&r.code!=='미상'?`<div class="record-code">${r.code}</div>`:''}
      <div style="font-size:10px;color:#8b949e">${r.crossGroup||r.group}</div>
    </div>
  </div>`;
}

// ============================================================
// 이력
// ============================================================
function renderHistory() {
  const search = document.getElementById('searchInput')?.value || '';
  const el = document.getElementById('historyContent');
  if (!records.length) { el.innerHTML='<div class="empty">아직 기록이 없습니다.</div>'; return; }
  let html = '';
  CROPS.forEach(crop => {
    const cr = records.filter(r => r.crop===crop && (!search || r.name.includes(search)||r.code.includes(search)||r.crossGroup.includes(search)));
    if (!cr.length) return;
    const cgc = {};
    cr.forEach(r => { const g=r.crossGroup||r.code; if(g) cgc[g]=(cgc[g]||0)+1; });
    const dangers = Object.entries(cgc).filter(([,v])=>v>=2);
    html += `<div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <div style="font-weight:700;font-size:15px">${crop}</div>
        ${dangers.length?`<div class="danger-badge">⚠️ 교차저항 ${dangers.length}건</div>`:''}
      </div>`;
    Object.entries(cgc).sort((a,b)=>b[1]-a[1]).forEach(([code,cnt]) => {
      const color = cnt>=2?'#f87171':'#58a6ff';
      html += `<div class="bar-row">
        <div class="bar-label">${code}</div>
        <div class="bar-bg"><div class="bar-fill" style="width:${Math.min(cnt*25,100)}%;background:${color}"></div></div>
        <div class="bar-count" style="color:${color}">${cnt}회</div>
      </div>`;
    });
    cr.slice(0,3).forEach(r => { html += recordCardHtml(r, true); });
    if (cr.length>3) html += `<div style="text-align:center;color:#8b949e;font-size:12px;margin-top:6px">+${cr.length-3}건 더</div>`;
    html += '</div>';
  });
  el.innerHTML = html || '<div class="empty">검색 결과가 없습니다.</div>';
}

// ============================================================
// 추천
// ============================================================
function renderRecommend() {
  const el = document.getElementById('recommendContent');
  const cr = records.filter(r=>r.crop===recCrop);
  const cgc = {};
  cr.forEach(r=>{ const g=r.crossGroup||r.code; if(g) cgc[g]=(cgc[g]||0)+1; });
  const dangers = Object.entries(cgc).filter(([,v])=>v>=2);

  let html = '';
  if (dangers.length) {
    html += `<div style="background:#2d1010;border:1px solid #f87171;border-radius:10px;padding:10px 14px;margin-bottom:14px">
      <div style="color:#f87171;font-weight:700;font-size:13px;margin-bottom:6px">⚠️ ${recCrop} 교차저항 위험 계통</div>
      ${dangers.map(([g,cnt])=>`<div style="font-size:12px;color:#fca5a5;margin-bottom:3px">• ${g} — ${cnt}회 사용 (교체 필요)</div>`).join('')}
    </div>`;
  }

  html += `<div class="section-title">🔄 ${recCrop} — 계통별 추천</div>`;
  Object.entries(CROSS_RESISTANCE).forEach(([group, names]) => {
    const used = cgc[group] || 0;
    const color = used===0?'#1f3a5f':used>=2?'#3d1a1a':'#21262d';
    const textColor = used===0?'#58a6ff':used>=2?'#f87171':'#fbbf24';
    const badge = used===0?'✅ 미사용':used>=2?'⚠️ 교체필요':'사용중';
    html += `<div class="rec-card" style="border:1px solid ${color}">
      <div style="flex:1">
        <div style="font-size:12px;color:${textColor};font-weight:700;margin-bottom:4px">${group} ${badge}</div>
        <div style="font-size:12px;color:#8b949e">${names.slice(0,4).join(' · ')}${names.length>4?'…':''}</div>
      </div>
      <div style="font-size:11px;color:#8b949e;margin-left:8px">${used}회</div>
    </div>`;
  });

  html += `<div class="guide-box">
    <div style="font-weight:700;margin-bottom:8px">📌 교차저항 로테이션 원칙</div>
    ${["같은 계통(FRAC/IRAC) 약제는 상표명 달라도 교차저항 발생","동일 계통 연속 2회 이상 사용 금지","저항성 높은 계통(QoI·DMI·네오니코)은 시즌 2~3회 이하","M계(무기황·동·만코제브) 혼용으로 저항성 억제"].map((t,i)=>`<div class="guide-item"><span class="guide-num">${i+1}.</span><span>${t}</span></div>`).join('')}
  </div>`;

  el.innerHTML = html;
}

// 바깥 클릭시 추천 닫기
document.addEventListener('click', function(e) {
  if (!e.target.closest('.pos-rel')) {
    document.getElementById('suggestBox').style.display = 'none';
  }
});
</script>
